let currentCountry = 'TR';

function renderCountries() {
    const container = document.getElementById('countries-container');
    container.innerHTML = '';
    
    Object.values(countriesData).forEach((country, index) => {
        const isActive = country.code === currentCountry;
        const div = document.createElement('div');
        div.className = `flex flex-col items-center gap-1 cursor-pointer transition-all duration-300 ${isActive ? 'scale-105' : 'opacity-60 hover:opacity-100'}`;
        div.onclick = () => selectCountry(country.code);
        
        div.innerHTML = `
            <div class="relative country-circle-hover transition-all duration-300">
                <div class="size-9 rounded-full overflow-hidden border-2 ${isActive ? 'border-gold-primary glow-gold-active' : 'border-border-subtle'} transition-all duration-300">
                    <img src="${country.flag}" alt="${country.name}" class="w-full h-full object-cover ${isActive ? 'scale-110' : 'scale-100'} transition-transform duration-500"/>
                </div>
                ${isActive ? `
                    <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-gold-primary rounded-full flex items-center justify-center border-2 border-darkest shadow-lg">
                        <span class="material-symbols-outlined text-[8px] text-darkest font-bold">check</span>
                    </div>
                ` : ''}
            </div>
            <span class="text-[7px] font-bold tracking-tight ${isActive ? 'text-gold-primary' : 'text-text-desc'} uppercase text-center leading-tight">${country.name}</span>
        `;
        
        container.appendChild(div);
    });
}

function selectCountry(code) {
    currentCountry = code;
    renderCountries();
    renderRegions();
    
    // Update header display
    document.getElementById('selected-country-display').textContent = countriesData[code].name;
}

function renderRegions() {
    const country = countriesData[currentCountry];
    const container = document.getElementById('regions-container');
    
    // Update stats
    document.getElementById('region-count').textContent = country.regions.length;
    document.getElementById('city-count').textContent = country.cities;
    document.getElementById('region-title').textContent = `${country.name} Bölgeleri`;
    
    container.innerHTML = '';
    
    country.regions.forEach((region, index) => {
        const card = document.createElement('div');
        card.className = 'relative h-36 rounded-xl overflow-hidden group cursor-pointer border border-border-subtle bg-card-bg card-inner-glow region-card-hover transition-all duration-500 animate-slide-up shimmer';
        card.style.animationDelay = `${index * 0.08}s`;
        
        // ⭐ YENİ: Tıklama olayı ekle - Bölge kartına tıklayınca ilgili sayfaya git
        card.onclick = () => {
            window.location.href = `${region.id}.html`;
        };
        
        card.innerHTML = `
            <img alt="${region.name}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-60 group-hover:opacity-40" src="${region.image}"/>
            <div class="absolute inset-0 card-gradient-gold group-hover:bg-gradient-to-t group-hover:from-darkest/90 group-hover:to-transparent transition-all duration-500"></div>
            
            <!-- Content -->
            <div class="absolute inset-0 p-4 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-[8px] tracking-[0.1em] text-gold-primary font-bold uppercase bg-gold-primary/10 px-1.5 py-0.5 rounded-full backdrop-blur-sm border border-gold-primary/20">${region.subtitle}</span>
                        <div class="flex items-center gap-1 bg-black/30 backdrop-blur-md px-1.5 py-0.5 rounded-full border border-white/10">
                            <span class="material-symbols-outlined text-[9px] text-gold-primary">location_city</span>
                            <span class="text-[9px] text-white font-bold">${region.cities}</span>
                        </div>
                    </div>
                    <h3 class="text-base font-bold text-white mb-0.5 group-hover:text-gold-primary transition-colors leading-tight">${region.name}</h3>
                    <p class="text-[11px] text-text-desc line-clamp-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 transform translate-y-2 group-hover:translate-y-0">${region.description}</p>
                </div>
                
                <!-- Highlights -->
                <div class="flex flex-wrap gap-1 opacity-0 group-hover:opacity-100 transition-all duration-500 transform translate-y-3 group-hover:translate-y-0">
                    ${region.highlights.map(h => `
                        <span class="text-[8px] px-1.5 py-0.5 bg-white/10 backdrop-blur-sm rounded border border-white/20 text-text-secondary">${h}</span>
                    `).join('')}
                </div>
            </div>
            
            <!-- Hover Action -->
            <div class="absolute right-3 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-4 group-hover:translate-x-0">
                <button class="flex items-center justify-center w-9 h-9 bg-gold-primary rounded-full text-darkest shadow-lg hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
                </button>
            </div>
            
            <!-- Corner decoration -->
            <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-gold-primary/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
        `;
        
        container.appendChild(card);
    });
}

// Initialize
renderCountries();
renderRegions();
</script>
