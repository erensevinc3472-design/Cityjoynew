let currentFilter = {
    category: 'all',
    district: 'all',
    price: 'all',
    search: ''
};

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    renderMuseums();
    setupSearch();
    setupOfflineDetection();
    
    // Register Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/js/sw.js').catch(console.error);
    }
});

function setupOfflineDetection() {
    const banner = document.getElementById('offline-banner');
    
    function updateOnlineStatus() {
        if (navigator.onLine) {
            banner.classList.add('hidden');
        } else {
            banner.classList.remove('hidden');
        }
    }
    
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
}

function setupSearch() {
    const searchInput = document.getElementById('museum-search');
    let debounceTimer;
    
    searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            currentFilter.search = e.target.value.toLowerCase();
            renderMuseums();
        }, 300);
    });
}

function filterMuseums(category) {
    currentFilter.category = category;
    
    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.category === category) {
            btn.classList.remove('bg-card-bg/50', 'text-text-secondary', 'border', 'border-border-subtle/30');
            btn.classList.add('bg-gold-primary', 'text-darkest');
            btn.setAttribute('aria-selected', 'true');
        } else {
            btn.classList.add('bg-card-bg/50', 'text-text-secondary', 'border', 'border-border-subtle/30');
            btn.classList.remove('bg-gold-primary', 'text-darkest');
            btn.setAttribute('aria-selected', 'false');
        }
    });
    
    renderMuseums();
}

function filterByDistrict(district) {
    currentFilter.district = district;
    
    document.querySelectorAll('.district-filter').forEach(btn => {
        if (btn.dataset.district === district) {
            btn.classList.remove('bg-card-bg/50', 'text-text-secondary', 'border', 'border-border-subtle/30');
            btn.classList.add('bg-gold-primary', 'text-darkest');
        } else {
            btn.classList.add('bg-card-bg/50', 'text-text-secondary', 'border', 'border-border-subtle/30');
            btn.classList.remove('bg-gold-primary', 'text-darkest');
        }
    });
}

function filterByPrice(price) {
    currentFilter.price = price;
    
    document.querySelectorAll('.price-filter').forEach(btn => {
        if (btn.dataset.price === price) {
            btn.classList.remove('bg-card-bg/50', 'text-text-secondary', 'border', 'border-border-subtle/30');
            btn.classList.add('bg-gold-primary', 'text-darkest');
        } else {
            btn.classList.add('bg-card-bg/50', 'text-text-secondary', 'border', 'border-border-subtle/30');
            btn.classList.remove('bg-gold-primary', 'text-darkest');
        }
    });
}

function applyFilters() {
    renderMuseums();
    closeFilterModal();
}

function renderMuseums() {
    const list = document.getElementById('museum-list');
    const noResults = document.getElementById('no-results');
    
    let filtered = museums.filter(museum => {
        const matchCategory = currentFilter.category === 'all' || museum.category === currentFilter.category;
        const matchDistrict = currentFilter.district === 'all' || museum.district === currentFilter.district;
        const matchPrice = currentFilter.price === 'all' || museum.priceType === currentFilter.price;
        const matchSearch = currentFilter.search === '' || 
            museum.name.toLowerCase().includes(currentFilter.search) ||
            museum.district.toLowerCase().includes(currentFilter.search) ||
            museum.description.toLowerCase().includes(currentFilter.search);
        
        return matchCategory && matchDistrict && matchPrice && matchSearch;
    });
    
    if (filtered.length === 0) {
        list.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
    }
    
    noResults.classList.add('hidden');
    
    list.innerHTML = filtered.map((museum, index) => `
        <article class="museum-card rounded-2xl overflow-hidden cursor-pointer animate-fade-in" 
                 style="animation-delay: ${index * 0.05}s"
                 onclick="openMuseumModal(${museum.id})"
                 role="button"
                 tabindex="0"
                 aria-label="${museum.name} detaylarını görüntüle">
            <div class="flex gap-4 p-4">
                <div class="w-24 h-24 rounded-xl overflow-hidden shrink-0 bg-card-bg/50">
                    <img src="${museum.image}" 
                         alt="${museum.name}" 
                         class="w-full h-full object-cover"
                         loading="lazy"
                         onerror="this.src='https://images.unsplash.com/photo-1564399579883-451a5d44ec08?w=600&q=80'">
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <span class="text-[10px] text-gold-primary uppercase tracking-wider font-bold">${museum.district}</span>
                            <h3 class="text-base font-bold text-white leading-tight mt-0.5">${museum.name}</h3>
                        </div>
                        <span class="material-symbols-outlined text-gold-primary">chevron_right</span>
                    </div>
                    <p class="text-xs text-text-desc mt-1 line-clamp-2">${museum.description.substring(0, 80)}...</p>
                    <div class="flex items-center gap-3 mt-2">
                        <span class="flex items-center gap-1 text-[10px] text-text-secondary">
                            <span class="material-symbols-outlined text-gold-primary text-xs fill-1">star</span>
                            ${museum.rating}
                        </span>
                        <span class="flex items-center gap-1 text-[10px] text-text-secondary">
                            <span class="material-symbols-outlined text-xs">schedule</span>
                            ${museum.hours.split(' - ')[0]}
                        </span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full ${museum.priceType === 'free' ? 'bg-green-500/20 text-green-400' : 'bg-gold-primary/20 text-gold-primary'}">
                            ${museum.price === 'Ücretsiz' ? 'Ücretsiz' : 'Ücretli'}
                        </span>
                    </div>
                </div>
            </div>
        </article>
    `).join('');
}

function openMuseumModal(id) {
    const museum = museums.find(m => m.id === id);
    if (!museum) return;
    
    const modal = document.getElementById('museum-modal');
    const title = document.getElementById('modal-title');
    const content = document.getElementById('modal-content');
    
    title.textContent = museum.name;
    
    content.innerHTML = `
        <div class="space-y-6">
            <!-- Hero Image -->
            <div class="relative h-48 rounded-2xl overflow-hidden">
                <img src="${museum.image}" 
                     alt="${museum.name}" 
                     class="w-full h-full object-cover"
                     onerror="this.src='https://images.unsplash.com/photo-1564399579883-451a5d44ec08?w=600&q=80'">
                <div class="absolute inset-0 bg-gradient-to-t from-darkest via-darkest/50 to-transparent"></div>
                <div class="absolute bottom-3 left-3 right-3">
                    <span class="px-2 py-1 bg-gold-primary/20 border border-gold-primary/40 rounded text-gold-primary text-[10px] font-bold uppercase">${museum.district}</span>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="flex items-center gap-1 text-white text-sm">
                            <span class="material-symbols-outlined text-gold-primary text-sm fill-1">star</span>
                            ${museum.rating} (${museum.reviews} değerlendirme)
                        </span>
                    </div>
                </div>
            </div>
            
            <!-- Quick Info -->
            <div class="grid grid-cols-2 gap-3">
                <div class="glass-panel rounded-xl p-3 text-center">
                    <span class="material-symbols-outlined text-gold-primary text-xl mb-1">schedule</span>
                    <p class="text-[10px] text-text-desc uppercase">Çalışma Saatleri</p>
                    <p class="text-xs text-white font-bold mt-0.5">${museum.hours}</p>
                </div>
                <div class="glass-panel rounded-xl p-3 text-center">
                    <span class="material-symbols-outlined text-gold-primary text-xl mb-1">payments</span>
                    <p class="text-[10px] text-text-desc uppercase">Giriş Ücreti</p>
                    <p class="text-xs text-white font-bold mt-0.5">${museum.price}</p>
                </div>
            </div>
            
            <!-- Description -->
            <div>
                <h3 class="text-sm font-bold text-gold-primary uppercase tracking-wider mb-2">Hakkında</h3>
                <p class="text-sm text-text-secondary leading-relaxed">${museum.description}</p>
            </div>
            
            <!-- Features -->
            <div>
                <h3 class="text-sm font-bold text-gold-primary uppercase tracking-wider mb-2">Özellikler</h3>
                <div class="flex flex-wrap gap-2">
                    ${museum.features.map(feature => `
                        <span class="px-3 py-1.5 bg-card-bg/50 border border-border-subtle/30 rounded-lg text-xs text-text-secondary">
                            ${feature}
                        </span>
                    `).join('')}
                </div>
            </div>
            
            <!-- Contact Info -->
            <div>
                <h3 class="text-sm font-bold text-gold-primary uppercase tracking-wider mb-2">İletişim</h3>
                <div class="space-y-2">
                    <a href="https://maps.google.com/?q=${encodeURIComponent(museum.address)}" 
                       target="_blank"
                       class="flex items-center gap-3 p-3 bg-card-bg/30 rounded-xl hover:bg-card-bg/50 transition-colors">
                        <span class="material-symbols-outlined text-gold-primary">location_on</span>
                        <div class="flex-1">
                            <p class="text-xs text-text-desc">Adres</p>
                            <p class="text-sm text-white">${museum.address}</p>
                        </div>
                        <span class="material-symbols-outlined text-text-desc">open_in_new</span>
                    </a>
                    <a href="tel:${museum.phone.replace(/\s/g, '')}" 
                       class="flex items-center gap-3 p-3 bg-card-bg/30 rounded-xl hover:bg-card-bg/50 transition-colors">
                        <span class="material-symbols-outlined text-gold-primary">phone</span>
                        <div class="flex-1">
                            <p class="text-xs text-text-desc">Telefon</p>
                            <p class="text-sm text-white">${museum.phone}</p>
                        </div>
                        <span class="material-symbols-outlined text-text-desc">call</span>
                    </a>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex gap-3 pt-4">
                <button onclick="shareMuseum(${museum.id})" 
                        class="flex-1 py-3 bg-card-bg/50 border border-border-subtle/30 rounded-xl text-text-secondary text-sm font-bold hover:border-gold-primary/50 hover:text-gold-primary transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">share</span>
                    Paylaş
                </button>
                <button onclick="getDirections('${museum.address}')" 
                        class="flex-1 py-3 bg-gold-primary text-darkest rounded-xl text-sm font-bold hover:shadow-lg hover:shadow-gold-primary/30 transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">directions</span>
                    Yol Tarifi
                </button>
            </div>
        </div>
    `;
    
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeMuseumModal() {
    const modal = document.getElementById('museum-modal');
    modal.classList.add('hidden');
    document.body.style.overflow = '';
}

function openFilterModal() {
    document.getElementById('filter-modal').classList.remove('hidden');
}

function closeFilterModal() {
    document.getElementById('filter-modal').classList.add('hidden');
}

function shareMuseum(id) {
    const museum = museums.find(m => m.id === id);
    if (navigator.share) {
        navigator.share({
            title: museum.name,
            text: `${museum.name} - ${museum.description.substring(0, 100)}...`,
            url: window.location.href
        }).catch(() => {
            // User cancelled or error
        });
    } else {
        // Fallback - copy to clipboard
        const text = `${museum.name}\n${museum.address}\nTel: ${museum.phone}`;
        navigator.clipboard.writeText(text).then(() => {
            showToast('Bilgiler kopyalandı');
        });
    }
}

function getDirections(address) {
    window.open(`https://maps.google.com/?q=${encodeURIComponent(address)}`, '_blank');
}

function showToast(message) {
    // Simple toast implementation
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-gold-primary text-darkest px-6 py-3 rounded-full text-sm font-bold z-[70] animate-fade-in';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// Close modals on escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeMuseumModal();
        closeFilterModal();
    }
});
</script>

</body>
</html>
