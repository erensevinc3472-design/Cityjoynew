<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>CityJoy - Reels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Reels Container */
        .reels-container {
            height: 100vh;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            position: relative;
        }
        
        /* Individual Reel */
        .reel-item {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        /* Video */
        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Gradient Overlays */
        .gradient-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
            pointer-events: none;
            z-index: 10;
        }
        
        .gradient-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            pointer-events: none;
            z-index: 10;
        }
        
        /* Header */
        .reels-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 50px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }
        
        .reels-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        
        /* Side Actions */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 20;
        }
        
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .action-btn:active {
            transform: scale(0.9);
        }
        
        .action-btn .icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
        }
        
        .action-btn .icon span {
            font-size: 28px;
        }
        
        .action-btn .count {
            font-size: 12px;
            font-weight: 500;
        }
        
        .action-btn.liked .icon {
            background: rgba(224, 176, 122, 0.2);
        }
        
        .action-btn.liked .icon span {
            color: #E0B07A;
            font-variation-settings: 'FILL' 1;
        }
        
        /* Profile Button */
        .profile-btn {
            position: relative;
        }
        
        .profile-btn img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
        }
        
        .profile-btn .add-icon {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #E0B07A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-btn .add-icon span {
            font-size: 14px;
            color: #081F24;
        }
        
        /* Bottom Info */
        .bottom-info {
            position: absolute;
            bottom: 80px;
            left: 16px;
            right: 80px;
            z-index: 20;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .user-info img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .user-info .username {
            font-size: 15px;
            font-weight: 600;
        }
        
        .user-info .follow-btn {
            font-size: 12px;
            color: #E0B07A;
            border: 1px solid #E0B07A;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .description {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .music-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            opacity: 0.9;
        }
        
        .music-info . rotating {
            animation: rotate 3s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Progress Bar */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.2);
            z-index: 30;
        }
        
        .progress-fill {
            height: 100%;
            background: #E0B07A;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 20px;
            z-index: 50;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            padding: 4px 12px;
            transition: color 0.2s;
        }
        
        .nav-item.active {
            color: #E0B07A;
        }
        
        .nav-item.active span {
            font-variation-settings: 'FILL' 1;
        }
        
        .nav-item span {
            font-size: 24px;
        }
        
        .nav-item label {
            font-size: 10px;
            font-weight: 500;
        }
        
        /* Loading */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
        }
        
        .loading-screen .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(224, 176, 122, 0.3);
            border-top-color: #E0B07A;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Share Modal */
        .share-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 430px;
            margin: 0 auto;
            background: #0A2A2F;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 60;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .share-modal.open {
            transform: translateY(0);
        }
        
        .share-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 55;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .share-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        
        /* Comments Modal */
        .comments-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 430px;
            margin: 0 auto;
            height: 70vh;
            background: #0A2A2F;
            border-radius: 20px 20px 0 0;
            z-index: 60;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .comments-modal.open {
            transform: translateY(0);
        }
        
        .comments-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(63, 110, 112, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .comment-input-area {
            padding: 12px 16px;
            border-top: 1px solid rgba(63, 110, 112, 0.3);
            display: flex;
            gap: 12px;
        }
        
        .comment-input-area input {
            flex: 1;
            background: rgba(23, 70, 75, 0.5);
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 14px;
        }
        
        .comment-input-area input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .comment-input-area button {
            color: #E0B07A;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="commentsModal" class="comments-modal">
        <div class="comments-header">
            <span class="text-[16px] font-semibold">Yorumlar</span>
            <button onclick="closeCommentsModal()">
                <span class="material-symbols-outlined text-[24px]">close</span>

        <div class="comments-list" id="commentsList">

            <button onclick="postComment()">Gönder</button>
        </div>
    </div>

    <script>
        // Sample Reels Data
        const reelsData = [
            {

                user: 'bursa_haber',

                description: 'Bursa\'da bugün hava çok güzel! 🌞 #bursa #hava #gündem',

                likes: '45.2K',

                shares: 456
            },
            {

                video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
                user: 'spor_türkiye',
                avatar: 'https://images.unsplash.com/photo-1495020689067-958852a7765e?w=100&h=100&fit=crop',
                description: 'Muhteşem gol! ⚽🔥 #futbol #gol #süperlig',

            },
            {
                id: 3,
                video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                user: 'yemek_tarifleri',
                avatar: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=100&h=100&fit=crop',
                description: 'Enfes bir tarif! 🍳 Denemeyen kalmasın #yemek #tarif #mutfak',
                music: 'Yemek Müziği - Chef',
                likes: '67.8K',
                comments: 890,
                shares: 234
            },
            {
                id: 4,
                video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
                user: 'seyahatci',
                avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop',
                description: 'Uludağ\'dan muhteşem manzara 🏔️ #uludağ #bursa #kar #kış',
                music: 'Doğa Sesleri - Nature',
                likes: '89.3K',
                comments: 1567,
                shares: 890
            },
            {
                id: 5,
                video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4',
                user: 'eglence_kanal',
                avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop',
                description: 'Gülmekten yarıldım 😂😂😂 #komedi #eğlence #gülmek',
                music: 'Komedi Efektleri - Fun',
                likes: '234K',
                comments: 6789,
                shares: 3400
            },
            {
                id: 6,
                video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',
                user: 'araba_dünyası',
                avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop',
                description: 'Yeni model ilk kez görüntülendi! 🚗 #araba #otomobil #yeni',
                music: 'Araba Motoru - Auto',
                likes: '156K',
                comments: 2345,
                shares: 1567
            },
            {
                id: 7,
                video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4',
                user: 'teknoloji_haber',
                avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop',
                description: 'Yeni iPhone tanıtıldı! 📱 #apple #iphone #teknoloji',
                music: 'Tech Beat - Technology',
                likes: '345K',
                comments: 8901,
                shares: 4567
            },
            {
                id: 8,
                video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',
                user: 'film_kesitleri',
                avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop',
                description: 'Bu filmi kaçırmayın! 🎬 #film #sinema #fragman',
                music: 'Film Müziği - Cinema',
                likes: '78.9K',
                comments: 1234,
                shares: 567
            }
        ];

        let currentReelIndex = 0;
        let isPlaying = true;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                loadReels();
                setupIntersectionObserver();
            }, 1500);
        });

        function loadReels() {
            const container = document.getElementById('reelsContainer');
            
            reelsData.forEach((reel, index) => {
                const reelElement = createReelElement(reel, index);
                container.appendChild(reelElement);
            });
        }

        function createReelElement(reel, index) {
            const div = document.createElement('div');
            div.className = 'reel-item';
            div.dataset.index = index;
            
            div.innerHTML = `
                <!-- Video -->
                <video 
                    class="reel-video" 
                    src="${reel.video}" 
                    loop 
                    playsinline
                    ${index === 0 ? 'autoplay' : ''}
                    poster="${reel.avatar}"
                ></video>
                
                <!-- Gradients -->
                <div class="gradient-top"></div>
                <div class="gradient-bottom"></div>
                
                <!-- Header -->
                <div class="reels-header">
                    <button onclick="history.back()">
                        <span class="material-symbols-outlined text-[28px]">arrow_back</span>
                    </button>
                    <span class="reels-title">REELS</span>
                    <button onclick="openCamera()">
                        <span class="material-symbols-outlined text-[28px]">photo_camera</span>
                    </button>
                </div>
                
                <!-- Side Actions -->
                <div class="side-actions">
                    <div class="profile-btn">
                        <img src="${reel.avatar}" alt="${reel.user}">
                        <div class="add-icon">
                            <span class="material-symbols-outlined">add</span>
                        </div>
                    </div>
                    
                    <div class="action-btn ${index === 0 ? 'liked' : ''}" onclick="toggleLike(this)">
                        <div class="icon">
                            <span class="material-symbols-outlined">favorite</span>
                        </div>
                        <span class="count">${reel.likes}</span>
                    </div>
                    
                    <div class="action-btn" onclick="openCommentsModal(${reel.id})">
                        <div class="icon">
                            <span class="material-symbols-outlined">chat_bubble</span>
                        </div>
                        <span class="count">${formatCount(reel.comments)}</span>
                    </div>
                    
                    <div class="action-btn" onclick="openShareModal()">
                        <div class="icon">
                            <span class="material-symbols-outlined">share</span>
                        </div>
                        <span class="count">${formatCount(reel.shares)}</span>
                    </div>
                    
                    <div class="action-btn">
                        <div class="icon">
                            <span class="material-symbols-outlined">more_vert</span>
                        </div>
                    </div>
                </div>
                
                <!-- Bottom Info -->
                <div class="bottom-info">
                    <div class="user-info">
                        <img src="${reel.avatar}" alt="${reel.user}">
                        <span class="username">@${reel.user}</span>
                        <button class="follow-btn">Takip Et</button>
                    </div>
                    <p class="description">${reel.description}</p>
                    <div class="music-info">
                        <span class="material-symbols-outlined rotating text-[16px]">music_note</span>
                        <span>${reel.music}</span>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-${index}"></div>
                </div>
            `;
            
            // Double tap to like
            let lastTap = 0;
            div.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    // Double tap
                    const likeBtn = div.querySelector('.action-btn');
                    if (!likeBtn.classList.contains('liked')) {
                        toggleLike(likeBtn);
                        showHeartAnimation(e);
                    }
                }
                lastTap = currentTime;
            });
            
            // Tap to pause/play
            div.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON' && !e.target.closest('.action-btn') && !e.target.closest('.user-info')) {
                    togglePlayPause(div);
                }
            });
            
            return div;
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const index = parseInt(entry.target.dataset.index);
                    
                    if (entry.isIntersecting) {
                        currentReelIndex = index;
                        video.play();
                        isPlaying = true;
                        updateProgressBar(index);
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, {
                threshold: 0.6
            });
            
            document.querySelectorAll('.reel-item').forEach(item => {
                observer.observe(item);
            });
        }

        function updateProgressBar(index) {
            const video = document.querySelectorAll('.reel-video')[index];
            const progressBar = document.getElementById(`progress-${index}`);
            
            if (!video || !progressBar) return;
            
            video.addEventListener('timeupdate', () => {
                const progress = (video.currentTime / video.duration) * 100;
                progressBar.style.width = progress + '%';
            });
        }

        function togglePlayPause(reelItem) {
            const video = reelItem.querySelector('video');
            if (video.paused) {
                video.play();
                isPlaying = true;
            } else {
                video.pause();
                isPlaying = false;
            }
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            const count = btn.querySelector('.count');
            const currentCount = parseFloat(count.textContent.replace(/[KM]/, ''));
            
            if (btn.classList.contains('liked')) {
                count.textContent = formatCount(currentCount * 1000 + 1);
            } else {
                count.textContent = formatCount(currentCount * 1000 - 1);
            }
        }

        function showHeartAnimation(e) {
            const heart = document.createElement('div');
            heart.innerHTML = '<span class="material-symbols-outlined text-[80px] text-[#E0B07A]" style="font-variation-settings: \'FILL\' 1;">favorite</span>';
            heart.style.position = 'absolute';
            heart.style.left = (e.changedTouches[0].clientX - 40) + 'px';
            heart.style.top = (e.changedTouches[0].clientY - 40) + 'px';
            heart.style.pointerEvents = 'none';
            heart.style.animation = 'heartPop 0.6s ease forwards';
            heart.style.zIndex = '100';
            
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 600);
        }

        // Add heart animation keyframes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes heartPop {
                0% { transform: scale(0); opacity: 0; }
                50% { transform: scale(1.2); opacity: 1; }
                100% { transform: scale(1); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        function formatCount(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function openShareModal() {
            document.getElementById('shareOverlay').classList.add('open');
            document.getElementById('shareModal').classList.add('open');
        }

        function closeShareModal() {
            document.getElementById('shareOverlay').classList.remove('open');
            document.getElementById('shareModal').classList.remove('open');
        }

        function openCommentsModal(reelId) {
            const modal = document.getElementById('commentsModal');
            const overlay = document.getElementById('commentsOverlay');
            const list = document.getElementById('commentsList');
            
            // Sample comments
            const comments = [
                { user: 'ahmet_kaya', text: 'Muhteşem! 👏', likes: 45 },
                { user: 'zeynep_ozturk', text: 'Çok güzel olmuş 😍', likes: 23 },
                { user: 'burak_t', text: 'Bursa\'yı çok seviyorum', likes: 12 },
                { user: 'selin_k', text: 'Takipteyim!', likes: 8 }
            ];
            
            list.innerHTML = comments.map(c => `
                <div class="flex gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-[#17464B] flex items-center justify-center">
                        <span class="text-[12px] font-bold">${c.user[0].toUpperCase()}</span>
                    </div>
                    <div class="flex-1">
                        <p class="text-[13px] font-semibold">${c.user}</p>
                        <p class="text-[13px] text-[#9FB6B8]">${c.text}</p>
                        <div class="flex items-center gap-4 mt-1">
                            <span class="text-[11px] text-[#6E8C8E]">2s</span>
                            <span class="text-[11px] text-[#6E8C8E]">Beğen</span>
                            <span class="text-[11px] text-[#6E8C8E]">Yanıtla</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <span class="material-symbols-outlined text-[16px] text-[#6E8C8E]">favorite</span>
                        <span class="text-[10px] text-[#6E8C8E]">${c.likes}</span>
                    </div>
                </div>
            `).join('');
            
            overlay.classList.add('open');
            modal.classList.add('open');
        }

        function closeCommentsModal() {
            document.getElementById('commentsOverlay').classList.remove('open');
            document.getElementById('commentsModal').classList.remove('open');
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;
            
            const list = document.getElementById('commentsList');
            const newComment = document.createElement('div');
            newComment.className = 'flex gap-3 mb-4';
            newComment.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-[#17464B] flex items-center justify-center">
                    <span class="text-[12px] font-bold">K</span>
                </div>
                <div class="flex-1">
                    <p class="text-[13px] font-semibold">kullanici</p>
                    <p class="text-[13px] text-[#9FB6B8]">${text}</p>
                    <div class="flex items-center gap-4 mt-1">
                        <span class="text-[11px] text-[#6E8C8E]">Şimdi</span>
                        <span class="text-[11px] text-[#6E8C8E]">Beğen</span>
                        <span class="text-[11px] text-[#6E8C8E]">Yanıtla</span>
                    </div>
                </div>
            `;
            list.insertBefore(newComment, list.firstChild);
            input.value = '';
        }

        function openCamera() {
            alert('Kamera açılıyor...');
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                scrollToReel(currentReelIndex - 1);
            } else if (e.key === 'ArrowDown') {
                scrollToReel(currentReelIndex + 1);
            }
        });

        function scrollToReel(index) {
            const reels = document.querySelectorAll('.reel-item');
            if (index >= 0 && index < reels.length) {
                reels[index].scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
