<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityJoy - Premium Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .screen {
            width: 100%;
            height: 100%;
            max-width: 430px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 1.5s ease-in-out, transform 8s ease-out;
        }

        .bg-image.active {
            opacity: 1;
            transform: scale(1);
        }

        .bg-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .overlay-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(15, 174, 189, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, 
                    rgba(10, 10, 10, 0.2) 0%, 
                    rgba(10, 10, 10, 0.5) 60%, 
                    rgba(10, 10, 10, 0.95) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 60px 30px 40px;
        }

        .top-section {
            text-align: center;
            margin-top: 12vh;
            position: relative;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            animation: slideDown 1s ease-out;
        }

        .logo-icon-modern {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 15px;
            filter: drop-shadow(0 10px 30px rgba(15, 174, 189, 0.4));
        }

        .logo-text-modern {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 0%, #0faebd 30%, #d4af37 70%, #fff 100%);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            position: relative;
        }

        .logo-text-modern::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0faebd, #d4af37, transparent);
            border-radius: 2px;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            font-size: 16px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 30px;
            animation: slideUp 1s ease-out 0.3s both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tagline {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            line-height: 1.5;
            max-width: 320px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.6s forwards;
            min-height: 70px;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-indicators {
            display: flex;
            gap: 10px;
            margin-top: auto;
            margin-bottom: 40px;
            z-index: 10;
        }

        .indicator {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .indicator.active::after {
            content: '';
            display: block;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0faebd, #d4af37);
            animation: progress 5s linear forwards;
        }

        @keyframes progress {
            to { width: 100%; }
        }

        .unlock-section {
            width: 100%;
            max-width: 320px;
            margin-bottom: 30px;
        }

        .slide-unlock-container {
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .slide-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .slide-handle {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #0faebd 0%, #d4af37 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px 20px rgba(15, 174, 189, 0.4);
            transition: transform 0.1s;
            z-index: 10;
        }

        .slide-handle:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .slide-handle::after {
            content: '→';
            color: white;
            font-size: 24px;
        }

        .slide-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(15, 174, 189, 0.3), rgba(212, 175, 55, 0.2));
            width: 0%;
            transition: width 0.1s;
        }

        .lang-indicator {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 12px;
            color: #fff;
            font-weight: 600;
            letter-spacing: 2px;
            z-index: 20;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #0faebd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            letter-spacing: 2px;
        }

        @media (min-width: 431px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background: #1a1a2e;
            }

            .screen {
                height: 90vh;
                max-height: 844px;
                border-radius: 40px;
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            }
        }
    </style>
</head>
<body>
    <div class="screen" id="screen">
        <div class="loading-screen" id="loadingScreen">
            <div class="loader"></div>
            <div class="loading-text">Yükleniyor</div>
        </div>

        <div class="bg-layer" id="bgLayer"></div>
        <div class="overlay-gradient"></div>
        <div class="lang-indicator" id="langIndicator">TR</div>

        <div class="content">
            <div class="top-section">
                <div class="logo-container">
                    <div class="logo-icon-modern">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#0faebd"/>
                                    <stop offset="100%" style="stop-color:#d4af37"/>
                                </linearGradient>
                            </defs>
                            <circle cx="50" cy="50" r="46" stroke="url(#logoGrad)" stroke-width="2" fill="none" opacity="0.3"/>
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
                            <path d="M28 68 L28 48 L38 38 L38 68 Z" fill="url(#logoGrad)" opacity="0.9"/>
                            <path d="M40 68 L40 43 L50 33 L50 68 Z" fill="url(#logoGrad)" opacity="0.7"/>
                            <path d="M52 68 L52 53 L62 43 L62 68 Z" fill="url(#logoGrad)" opacity="0.9"/>
                            <path d="M64 68 L64 58 L74 48 L74 68 Z" fill="url(#logoGrad)" opacity="0.7"/>
                            <line x1="22" y1="68" x2="78" y2="68" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round"/>
                            <circle cx="50" cy="33" r="2.5" fill="#fff" opacity="0.9"/>
                        </svg>
                    </div>
                    <div class="logo-text-modern">CityJoy</div>
                </div>

                <div class="brand" id="brandText">HOŞGELDİNİZ</div>
                <div class="tagline" id="taglineText">Doğayı keşfetmeye hazır mısın?</div>
            </div>

            <div class="slide-indicators" id="indicators"></div>

            <div class="unlock-section">
                <div class="slide-unlock-container" id="slideUnlock">
                    <div class="slide-progress" id="slideProgress"></div>
                    <div class="slide-text" id="slideText">Kaydırmaya Başla</div>
                    <div class="slide-handle" id="slideHandle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Oturum Kontrolü -->
    <script>
        // Anında kontrol et — Firebase beklemeden
        // localStorage'da oturum işareti var mı?
        if (localStorage.getItem('cj_oturum') === 'acik') {
            window.location.replace('kesfet-genel.html');
        }
    </script>
    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                localStorage.setItem('cj_oturum', 'acik');
                window.location.replace('kesfet-genel.html');
            } else {
                localStorage.removeItem('cj_oturum');
            }
        });
    </script>

    <script>
        // LOCAL IMAGES - NO INTERNET REQUIRED
        const images = [
            'cityjoy-assets/slide1.jpg',
            'cityjoy-assets/slide2.jpg',
            'cityjoy-assets/slide3.jpg',
            'cityjoy-assets/slide4.jpg',
            'cityjoy-assets/slide5.jpg'
        ];

        const texts = {
            tr: {
                brand: "HOŞGELDİNİZ",
                taglines: [
                    "Kış sporlarının heyecanını yaşa",
                    "Sisli dağların gizemini keşfet",
                    "Kapadokya'nın büyülü balonları",
                    "Kuzey ışıklarının dansını izle",
                    "Doğanın huzurunu içinde hisset"
                ],
                slideText: "Keşfetmeye Başla",
                lang: "TR"
            },
            en: {
                brand: "WELCOME",
                taglines: [
                    "Feel the thrill of winter sports",
                    "Discover misty mountain mysteries",
                    "Magical balloons of Cappadocia",
                    "Watch the northern lights dance",
                    "Feel the peace of nature"
                ],
                slideText: "Start Exploring",
                lang: "EN"
            }
        };

        let currentSlide = 0;
        let slides = [];
        let indicators = [];
        let slideInterval;

        function createSlides() {
            const container = document.getElementById('bgLayer');
            const indicatorContainer = document.getElementById('indicators');

            images.forEach((imgSrc, index) => {
                const slide = document.createElement('div');
                slide.className = 'bg-image' + (index === 0 ? ' active' : '');

                const img = document.createElement('img');
                img.src = imgSrc;
                img.onload = () => {
                    if (index === 0) {
                        setTimeout(() => {
                            document.getElementById('loadingScreen').classList.add('hidden');
                        }, 300);
                    }
                };

                slide.appendChild(img);
                container.appendChild(slide);
                slides.push(slide);

                const indicator = document.createElement('div');
                indicator.className = 'indicator' + (index === 0 ? ' active' : '');
                indicator.onclick = () => goToSlide(index);
                indicatorContainer.appendChild(indicator);
                indicators.push(indicator);
            });

            // 2 saniye sonra loading'i kaldır (güvenlik için)
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 2000);
        }

        function updateContent(slideIndex) {
            const isEnglish = slideIndex % 2 === 1;
            const lang = isEnglish ? 'en' : 'tr';
            const t = texts[lang];

            document.getElementById('brandText').textContent = t.brand;
            document.getElementById('slideText').textContent = t.slideText;
            document.getElementById('langIndicator').textContent = t.lang;

            const taglineEl = document.getElementById('taglineText');
            taglineEl.style.opacity = '0';

            setTimeout(() => {
                taglineEl.textContent = t.taglines[slideIndex % t.taglines.length];
                taglineEl.style.transition = 'opacity 0.5s';
                taglineEl.style.opacity = '1';
            }, 200);
        }

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));

            currentSlide = index;
            if (currentSlide >= images.length) currentSlide = 0;

            slides[currentSlide].classList.add('active');

            indicators.forEach((ind, i) => {
                ind.classList.remove('active');
                if (i === currentSlide) {
                    void ind.offsetWidth;
                    ind.classList.add('active');
                }
            });

            updateContent(currentSlide);
        }

        function nextSlide() {
            showSlide(currentSlide + 1);
        }

        function goToSlide(index) {
            showSlide(index);
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 5000);
        }

        function initSlideToUnlock() {
            const handle = document.getElementById('slideHandle');
            const container = document.getElementById('slideUnlock');
            const progress = document.getElementById('slideProgress');
            const text = document.getElementById('slideText');

            let isDragging = false;
            let startX = 0;
            let currentX = 0;
            let maxDrag = container.offsetWidth - handle.offsetWidth - 8;

            function startDrag(e) {
                isDragging = true;
                startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                handle.style.transition = 'none';
                progress.style.transition = 'none';
                text.style.opacity = '0.3';
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();

                const x = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const diff = x - startX;

                if (diff > 0 && diff <= maxDrag) {
                    currentX = diff;
                    handle.style.transform = `translateX(${currentX}px)`;
                    progress.style.width = `${(currentX / maxDrag) * 100}%`;
                }
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;

                if (currentX > maxDrag * 0.7) {
                    handle.style.transition = 'transform 0.3s';
                    progress.style.transition = 'width 0.3s';
                    handle.style.transform = `translateX(${maxDrag}px)`;
                    progress.style.width = '100%';
                    text.style.opacity = '0';

                    setTimeout(() => {
                        // Dil daha önce seçildi mi?
                        const lang = localStorage.getItem('selectedLanguage');
                        if (lang) {
                            window.location.href = 'kayit.html';
                        } else {
                            window.location.href = 'dil-secimi.html';
                        }
                    }, 300);
                } else {
                    handle.style.transition = 'transform 0.4s';
                    progress.style.transition = 'width 0.4s';
                    handle.style.transform = 'translateX(0)';
                    progress.style.width = '0%';
                    text.style.opacity = '1';
                }

                currentX = 0;
            }

            handle.addEventListener('touchstart', startDrag, {passive: false});
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('touchend', endDrag);

            handle.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', endDrag);
        }

        window.onload = () => {
            createSlides();
            initSlideToUnlock();
            updateContent(0);
            slideInterval = setInterval(nextSlide, 5000);
        };
    </script>
</body>
</html>
