        }

            background: linear-gradient(135deg, #F0C090 0%, #E0B07A 50%, #C09060 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-live {
            animation: pulseLive 2s infinite;
        }
        @keyframes pulseLive {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255, 68, 68, 0); }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .category-pill {
            transition: all 0.3s ease;
        }
        .category-pill.active {
            background: linear-gradient(135deg, #E0B07A 0%, #C09060 100%);
            color: #081F24;
            border-color: transparent;
        }
        .venue-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .venue-card:hover {

            border: 1px solid rgba(224, 176, 122, 0.2);
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: rgba(224, 176, 122, 0.5);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }
        .favorite-btn {

        }

            background: rgba(224, 176, 122, 0.2);

        let currentCategory = 'all';
        let currentTime = 'all';
        let currentSort = 'nearest';
        let openOnly = false;
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        let searchQuery = '';

        function init() {
            renderFeatured();
            renderVenues();
            updateFavCount();
        }

        function renderFeatured() {
            const featured = venues.filter(v => v.rating >= 4.8).slice(0, 4);
            const container = document.getElementById('featuredContainer');
            
            container.innerHTML = featured.map(venue => `
                <div onclick="openVenueModal(${venue.id})" class="min-w-[280px] glass-card rounded-2xl overflow-hidden relative cursor-pointer venue-card border border-gold/20">
                    <div class="h-32 bg-cover bg-center relative" style="background-image: url('${venue.image}')">
                        <div class="absolute inset-0 bg-gradient-to-t from-deep-teal to-transparent"></div>
                        <div class="absolute top-2 right-2 rating-badge px-2 py-1 rounded-lg flex items-center gap-1">
                            <span class="material-symbols-outlined text-gold text-sm fill-1">star</span>
                            <span class="text-sm font-bold text-gold">${venue.rating}</span>
                        </div>
                        ${venue.rating >= 4.8 ? '<div class="absolute top-2 left-2 bg-gold text-deep-teal px-2 py-0.5 rounded text-[10px] font-bold">EFSANE</div>' : ''}
                    </div>
                    <div class="p-3">
                        <h4 class="font-bold text-off-white text-sm truncate">${venue.name}</h4>
                        <p class="text-xs text-gray-text mt-0.5 truncate">${venue.specialty}</p>
                        <div class="flex items-center justify-between mt-2">
                            <span class="text-xs text-gray-text">${venue.distance} km</span>
                            <span class="price-tag px-2 py-0.5 rounded text-[10px] text-gold">${venue.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderVenues() {
            let filtered = venues.filter(venue => {
                // Category filter
                if (currentCategory !== 'all' && venue.category !== currentCategory) return false;
                
                // Search filter
                if (searchQuery && !venue.name.toLowerCase().includes(searchQuery.toLowerCase()) && 
                    !venue.specialty.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                
                // Time filter
                if (currentTime !== 'all') {
                    const hour = new Date().getHours();
                    let timeMatch = false;
                    switch(currentTime) {
                        case 'morning': timeMatch = hour >= 6 && hour < 12; break;
                        case 'lunch': timeMatch = hour >= 12 && hour < 15; break;
                        case 'evening': timeMatch = hour >= 18 && hour < 22; break;
                        case 'night': timeMatch = hour >= 22 || hour < 6; break;
                    }
                    if (!timeMatch && !isVenueOpen(venue)) return false;
                }
                
                // Open only filter
                if (openOnly && !isVenueOpen(venue)) return false;
                
                return true;
            });

            // Sort
            filtered.sort((a, b) => {
                switch(currentSort) {
                    case 'nearest': return a.distance - b.distance;
                    case 'rated': return b.rating - a.rating;
                    case 'price': return a.priceLevel - b.priceLevel;
                    default: return 0;
                }
            });

            document.getElementById('venueCount').textContent = `${filtered.length} mekan`;

            const container = document.getElementById('venuesContainer');
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-8 text-center">
                        <span class="material-symbols-outlined text-4xl text-gray-text mb-2">search_off</span>
                        <p class="text-sm text-gray-text">Sonuç bulunamadı</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(venue => {
                const isFav = favorites.includes(venue.id);
                const isOpen = isVenueOpen(venue);
                
                return `
                <div class="glass-card rounded-2xl overflow-hidden venue-card border border-white/5">
                    <div class="flex p-3 gap-3">
                        <div class="w-24 h-24 shrink-0 rounded-xl bg-cover bg-center relative" style="background-image: url('${venue.image}')">
                            ${venue.rating >= 4.8 ? '<div class="absolute -top-1 -left-1 w-6 h-6 bg-gold rounded-full flex items-center justify-center text-[10px] font-bold text-deep-teal">★</div>' : ''}
                        </div>
                        <div class="flex-1 flex flex-col justify-between min-w-0">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <h4 class="font-bold text-off-white text-sm truncate flex-1">${venue.name}</h4>
                                    <button onclick="toggleFavorite(${venue.id}, event)" class="favorite-btn w-8 h-8 flex items-center justify-center rounded-full ${isFav ? 'active' : 'bg-white/5'}">
                                        <span class="material-symbols-outlined text-lg ${isFav ? 'fill-1' : ''}">${isFav ? 'favorite' : 'favorite_border'}</span>
                                    </button>
                                </div>
                                <p class="text-xs text-gray-text mt-0.5 truncate">${venue.specialty}</p>
                                <div class="flex items-center gap-2 mt-1.5">
                                    <div class="rating-badge px-1.5 py-0.5 rounded flex items-center gap-0.5">
                                        <span class="material-symbols-outlined text-gold text-xs fill-1">star</span>
                                        <span class="text-xs font-semibold text-gold">${venue.rating}</span>
                                        <span class="text-[10px] text-gray-text">(${venue.reviews})</span>
                                    </div>
                                    <span class="text-[10px] text-gray-text">• ${venue.distance} km</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <div class="flex items-center gap-2">
                                    <span class="${isOpen ? 'status-open' : 'status-closed'} px-2 py-0.5 rounded text-[10px] font-bold uppercase flex items-center gap-1">
                                        <span class="w-1.5 h-1.5 rounded-full ${isOpen ? 'bg-success-green' : 'bg-red-500'} ${isOpen ? 'pulse-live' : ''}"></span>
                                        ${isOpen ? 'AÇIK' : 'KAPALI'}
                                    </span>
                                    <span class="price-tag px-1.5 py-0.5 rounded text-[10px] text-gold">${venue.price}</span>
                                </div>
                                <span class="text-[10px] text-gray-text">${venue.hours.open}-${venue.hours.close}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex border-t border-white/5 p-2 gap-2">
                        <button onclick="callVenue('${venue.phone}')" class="flex-1 bg-gold/10 hover:bg-gold/20 text-gold py-2.5 rounded-xl flex items-center justify-center gap-1.5 text-xs font-bold transition-colors">
                            <span class="material-symbols-outlined text-base">call</span> Ara
                        </button>
                        <button onclick="openVenueModal(${venue.id})" class="flex-1 bg-gold hover:bg-gold-light text-deep-teal py-2.5 rounded-xl flex items-center justify-center gap-1.5 text-xs font-bold transition-colors">
                            <span class="material-symbols-outlined text-base">info</span> Detay
                        </button>
                        <button onclick="getDirections('${venue.address}')" class="flex-1 bg-white/5 hover:bg-white/10 text-off-white py-2.5 rounded-xl flex items-center justify-center gap-1.5 text-xs font-bold transition-colors">
                            <span class="material-symbols-outlined text-base">directions</span> Yol
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function isVenueOpen(venue) {
            const hour = new Date().getHours();
            return hour >= venue.openTime && hour < venue.closeTime;
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-pill').forEach(el => el.classList.remove('active'));
            document.getElementById(`cat-${cat}`).classList.add('active');
            renderVenues();
        }

        function setTime(time) {
            currentTime = time;
            document.querySelectorAll('.time-badge').forEach(el => {
                el.classList.remove('active');
                el.classList.add('text-gray-text');
            });
            document.getElementById(`time-${time}`).classList.add('active');
            document.getElementById(`time-${time}`).classList.remove('text-gray-text');
            renderVenues();
        }

        function setSort(sort) {
            currentSort = sort;
            document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
            document.getElementById(`sort-${sort}`).classList.add('active');
            if (sort === 'open') openOnly = false;
            renderVenues();
        }

        function toggleOpenOnly() {
            openOnly = !openOnly;
            document.getElementById('filter-open').classList.toggle('active');
            renderVenues();
        }

        function filterVenues() {
            searchQuery = document.getElementById('searchInput').value;
            renderVenues();
        }

        function toggleFavorite(id, event) {
            if (event) event.stopPropagation();
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavCount();
            renderVenues();
        }

        function updateFavCount() {
            const count = favorites.length;
            const badge = document.getElementById('favCount');
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleFavorites() {
            if (favorites.length === 0) {
                alert('Henüz favori mekan eklemediniz!');
                return;
            }
            // Filter to show only favorites
            const favVenues = venues.filter(v => favorites.includes(v.id));
            document.getElementById('venuesContainer').innerHTML = favVenues.map(venue => {
                // Same render logic as above but for favorites only
                const isOpen = isVenueOpen(venue);
                return `
                <div class="glass-card rounded-2xl overflow-hidden venue-card border border-gold/30">
                    <div class="flex p-3 gap-3">
                        <div class="w-24 h-24 shrink-0 rounded-xl bg-cover bg-center" style="background-image: url('${venue.image}')"></div>
                        <div class="flex-1 flex flex-col justify-between min-w-0">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <h4 class="font-bold text-gold text-sm truncate flex-1">❤️ ${venue.name}</h4>
                                    <button onclick="toggleFavorite(${venue.id}, event)" class="favorite-btn active w-8 h-8 flex items-center justify-center rounded-full">
                                        <span class="material-symbols-outlined text-lg fill-1">favorite</span>
                                    </button>
                                </div>
                                <p class="text-xs text-gray-text mt-0.5 truncate">${venue.specialty}</p>
                                <div class="flex items-center gap-2 mt-1.5">
                                    <div class="rating-badge px-1.5 py-0.5 rounded flex items-center gap-0.5">
                                        <span class="material-symbols-outlined text-gold text-xs fill-1">star</span>
                                        <span class="text-xs font-semibold text-gold">${venue.rating}</span>
                                    </div>
                                    <span class="${isOpen ? 'status-open' : 'status-closed'} px-1.5 py-0.5 rounded text-[10px] font-bold">${isOpen ? 'AÇIK' : 'KAPALI'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex border-t border-white/5 p-2 gap-2">
                        <button onclick="callVenue('${venue.phone}')" class="flex-1 bg-gold/10 text-gold py-2 rounded-xl text-xs font-bold">Ara</button>
                        <button onclick="openVenueModal(${venue.id})" class="flex-1 bg-gold text-deep-teal py-2 rounded-xl text-xs font-bold">Detay</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('venueCount').textContent = `${favVenues.length} favori`;
        }

        function openVenueModal(id) {
            const venue = venues.find(v => v.id === id);
            if (!venue) return;

            const isFav = favorites.includes(id);
            const isOpen = isVenueOpen(venue);

            document.getElementById('modalContent').innerHTML = `
                <div class="relative h-64 -mx-4 -mt-6 mb-4">
                    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('${venue.image}')"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-deep-teal via-deep-teal/50 to-transparent"></div>
                    <div class="absolute bottom-4 left-4 right-4">
                        <h2 class="text-2xl font-bold text-off-white mb-1">${venue.name}</h2>
                        <p class="text-gold text-sm">${venue.specialty}</p>
                    </div>
                </div>

                <div class="flex items-center gap-3 mb-6">
                    <div class="rating-badge px-3 py-2 rounded-xl flex items-center gap-1 flex-1 justify-center">
                        <span class="material-symbols-outlined text-gold text-xl fill-1">star</span>
                        <span class="text-xl font-bold text-gold">${venue.rating}</span>
                        <span class="text-sm text-gray-text">/5 (${venue.reviews} yorum)</span>
                    </div>
                    <div class="${isOpen ? 'status-open' : 'status-closed'} px-3 py-2 rounded-xl flex items-center gap-2 flex-1 justify-center">
                        <span class="w-2 h-2 rounded-full ${isOpen ? 'bg-success-green' : 'bg-red-500'} ${isOpen ? 'pulse-live' : ''}"></span>
                        <span class="font-bold text-sm">${isOpen ? 'Şu An Açık' : 'Kapalı'}</span>
                    </div>
                </div>

                <div class="glass-card rounded-2xl p-4 space-y-4 mb-6">
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-gold shrink-0">location_on</span>
                        <div>
                            <p class="text-sm font-medium text-off-white">${venue.address}</p>
                            <p class="text-xs text-gray-text mt-0.5">${venue.distance} km uzaklıkta</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-gold shrink-0">schedule</span>
                        <div>
                            <p class="text-sm font-medium text-off-white">${venue.hours.open} - ${venue.hours.close}</p>
                            <p class="text-xs text-gray-text mt-0.5">Haftanın her günü</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-gold shrink-0">phone</span>
                        <div>
                            <p class="text-sm font-medium text-off-white">${venue.phone}</p>
                            <p class="text-xs text-gray-text mt-0.5">Rezervasyon için arayın</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-gold shrink-0">payments</span>
                        <div>
                            <p class="text-sm font-medium text-off-white">Fiyat Aralığı: ${venue.price}</p>
                            <p class="text-xs text-gray-text mt-0.5">${venue.priceLevel === 1 ? 'Ekonomik' : venue.priceLevel === 2 ? 'Orta' : 'Lüks'}</p>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-sm font-bold text-gold uppercase tracking-wider mb-3">Hakkında</h3>
                    <p class="text-sm text-gray-text leading-relaxed">${venue.description}</p>
                </div>

                <div class="mb-6">
                    <h3 class="text-sm font-bold text-gold uppercase tracking-wider mb-3">Öne Çıkanlar</h3>
                    <div class="flex flex-wrap gap-2">
                        ${venue.features.map(f => `
                            <span class="price-tag px-3 py-1.5 rounded-full text-xs text-gold">${f}</span>
                        `).join('')}
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="callVenue('${venue.phone}')" class="bg-gold text-deep-teal py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">call</span> Hemen Ara
                    </button>
                    <button onclick="getDirections('${venue.address}')" class="bg-white/10 text-off-white py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">directions</span> Yol Tarifi
                    </button>
                </div>

                ${venue.category === 'restaurant' || venue.category === 'kebap' ? `
                <button class="w-full mt-3 bg-gold/20 border border-gold/50 text-gold py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">event_available</span> Rezervasyon Yap
                </button>
                ` : ''}
            `;

            const favBtn = document.getElementById('modalFavBtn');
            favBtn.innerHTML = `<span class="material-symbols-outlined text-gold ${isFav ? 'fill-1' : ''}">${isFav ? 'favorite' : 'favorite_border'}</span>`;
            favBtn.onclick = () => {
                toggleFavorite(id);
                openVenueModal(id); // Refresh modal
            };

            document.getElementById('venueModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeVenueModal() {
            document.getElementById('venueModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function toggleFavoriteDetail() {
            // Handled in openVenueModal
        }

        function callVenue(phone) {
            window.location.href = `tel:${phone.replace(/\s/g, '')}`;
        }

        function getDirections(address) {
            const encoded = encodeURIComponent(address + ', Osmangazi, Bursa');
            window.open(`https://www.google.com/maps/search/?api=1&query=${encoded}`, '_blank');
        }

        // Initialize
        init();
    </script>
