    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #081F24;
            color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 20;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Video Grid Item */
        .video-grid-item {
            position: relative;
            aspect-ratio: 9/16;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .video-grid-item:hover {
            transform: scale(1.02);
        }
        .video-grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
        }
        .video-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
        }
        .play-icon-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: rgba(224, 176, 122, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-grid-item:hover .play-icon-overlay {
            opacity: 1;
        }
        .views-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        /* Search Bar */
        .search-container {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(8, 31, 36, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(63, 110, 112, 0.2);
        }
        .search-input {
            background: rgba(23, 70, 75, 0.5);
            border: 1px solid rgba(63, 110, 112, 0.3);
            transition: all 0.3s;
        }
        .search-input:focus {
            background: rgba(23, 70, 75, 0.8);
            border-color: #E0B07A;
            outline: none;
        }
        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(23, 70, 75, 0.5) 25%, rgba(63, 110, 112, 0.3) 50%, rgba(23, 70, 75, 0.5) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* Video Modal */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
        .overlay-enter {
            animation: fadeIn 0.2s ease-out forwards;
        }
        /* Full Screen Video Player */
        .fullscreen-player {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        .fullscreen-player video {
            flex: 1;
            width: 100%;
            object-fit: contain;
        }
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        /* Bottom Menu */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: rgba(10, 42, 47, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(63, 110, 112, 0.3);
            z-index: 50;
        }
    </style>

        function loadVideos() {
            const loadingState = document.getElementById('loading-state');
            const videoGrid = document.getElementById('video-grid');
            const loadMoreBtn = document.getElementById('load-more');

            loadingState.classList.add('hidden');
            videoGrid.classList.remove('hidden');
            loadMoreBtn.classList.remove('hidden');

            // Add 12 videos
            const startIndex = (currentPage - 1) * 12;
            const endIndex = startIndex + 12;
            const videosToLoad = videoDatabase.slice(startIndex, endIndex);

            videosToLoad.forEach((video, index) => {
                currentVideos.push(video);
                const videoElement = createVideoElement(video, startIndex + index);
                videoGrid.appendChild(videoElement);
            });
        }

        function createVideoElement(video, index) {
            const div = document.createElement('div');
            div.className = 'video-grid-item';
            div.onclick = () => openVideoModal(index);
            div.innerHTML = `
                <img src="${video.thumbnail}" class="w-full h-full object-cover" alt="${video.description}">

            return div;

            setTimeout(() => {
                // Duplicate videos with different IDs for demo
                const newVideos = videoDatabase.map(v => ({
                    ...v,
                    id: v.id + (currentPage * 100),
                    views: formatNumber(parseInt(v.views.replace(/[^0-9]/g, '')) + Math.floor(Math.random() * 100000))
                }));
                
                const videoGrid = document.getElementById('video-grid');
                newVideos.forEach((video, index) => {
                    currentVideos.push(video);
                    const videoElement = createVideoElement(video, currentVideos.length - 1);
                    videoGrid.appendChild(videoElement);
                });

                loadMoreBtn.innerHTML = `
                    <span class="material-symbols-outlined text-[16px]">refresh</span>
                    Daha Fazla
                `;
            }, 1000);
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            const clearBtn = document.getElementById('clearBtn');
            const videoGrid = document.getElementById('video-grid');
            const noResults = document.getElementById('no-results');

            clearBtn.style.display = query ? 'block' : 'none';

            if (!query) {
                // Show all videos
                Array.from(videoGrid.children).forEach(child => {
                    child.style.display = 'block';
                });
                noResults.classList.add('hidden');
                return;
            }

            // Filter videos
            let visibleCount = 0;
            Array.from(videoGrid.children).forEach((child, index) => {
                const video = currentVideos[index];
                const match = video && (
                    video.description.toLowerCase().includes(query) ||
                    video.username.toLowerCase().includes(query) ||
                    video.description.includes('#' + query)
                );
                
                child.style.display = match ? 'block' : 'none';
                if (match) visibleCount++;
            });

            noResults.classList.toggle('hidden', visibleCount > 0);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').style.display = 'none';
            handleSearch({ target: { value: '' } });
        }

        // Video Modal Functions
        function openVideoModal(index) {
            currentVideoIndex = index;
            const video = currentVideos[index];
            const modal = document.getElementById('videoModal');
            const modalVideo = document.getElementById('modalVideo');
            
            modalVideo.src = video.url;
            document.getElementById('modalAvatar').src = video.avatar;
            document.getElementById('modalUsername').textContent = '@' + video.username;
            document.getElementById('modalDesc').textContent = video.description;
            document.getElementById('modalLikeCount').textContent = formatNumber(video.likes);
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            modalVideo.play();
            updateProgress();
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const modalVideo = document.getElementById('modalVideo');
            
            modalVideo.pause();
            modalVideo.src = '';
            modal.classList.add('hidden');
            document.body.style.overflow = '';

        function toggleModalPlay() {
            const video = document.getElementById('modalVideo');
            const btn = document.getElementById('modalPlayBtn');
            
            if (video.paused) {
                video.play();
                btn.textContent = 'pause';
            } else {
                video.pause();
                btn.textContent = 'play_arrow';
            }
        }

        function toggleModalMute() {
            const video = document.getElementById('modalVideo');
            const btn = document.getElementById('modalMuteBtn');
            
            video.muted = !video.muted;
            btn.textContent = video.muted ? 'volume_off' : 'volume_up';
        }

        function updateProgress() {
            const video = document.getElementById('modalVideo');
            const progressBar = document.getElementById('progressBar');
            const timeDisplay = document.getElementById('modalTime');
            
            video.addEventListener('timeupdate', () => {
                const progress = (video.currentTime / video.duration) * 100;
                progressBar.style.width = progress + '%';
                
                const current = formatTime(video.currentTime);
                const total = formatTime(video.duration);
                timeDisplay.textContent = `${current} / ${total}`;
            });
        }

        function seekVideo(e) {
            const video = document.getElementById('modalVideo');
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        }

        function likeVideo() {
            const btn = document.getElementById('modalLikeBtn');
            const count = document.getElementById('modalLikeCount');
            const isLiked = btn.style.fontVariationSettings === "'FILL' 1";
            
            if (isLiked) {
                btn.style.fontVariationSettings = "'FILL' 0";
                btn.style.color = '';
            } else {
                btn.style.fontVariationSettings = "'FILL' 1";
                btn.style.color = '#E0B07A';
            }
        }

        function shareVideo() {
            // Share functionality
            alert('Paylaş menüsü açıldı');
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeVideoModal();
            }
        });

        // Swipe to next/prev video
        let touchStartY = 0;
        document.getElementById('videoModal')?.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.getElementById('videoModal')?.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentVideoIndex < currentVideos.length - 1) {
                    // Swipe up - next video
                    openVideoModal(currentVideoIndex + 1);
                } else if (diff < 0 && currentVideoIndex > 0) {
                    // Swipe down - prev video
                    openVideoModal(currentVideoIndex - 1);
                }
            }
        });
    </script>
</body>
</html>
