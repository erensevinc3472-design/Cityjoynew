<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - CityJoy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1511497584788-876760111969?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            position: relative;
            padding: 20px 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 31, 28, 0.55);
            z-index: 1;
        }

        .register-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            padding: 40px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            max-height: 90vh;
            overflow-y: auto;
        }

        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .back-btn:hover { background: rgba(255,255,255,0.2); }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            margin-top: 10px;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-group input::placeholder { color: rgba(255,255,255,0.6) !important; }

        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover,
        .input-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px rgba(15,174,189,0.2) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .input-group input:focus {
            background: rgba(255,255,255,0.25);
            border-color: rgba(15,174,189,0.5);
            box-shadow: 0 0 0 3px rgba(15,174,189,0.1);
        }

        .input-group input.error {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.1);
        }

        .input-group input.success {
            border-color: #10b981;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
            padding-left: 5px;
        }

        .password-toggle {
            position: absolute;
            right: 15px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #0faebd 0%, #0d8a96 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(15,174,189,0.3);
        }

        .register-btn:hover { transform: translateY(-2px); }
        .register-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .divider span { color: rgba(255,255,255,0.6); font-size: 13px; padding: 0 15px; }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .social-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
        }

        .social-btn:hover { transform: translateY(-3px); background: rgba(255,255,255,0.2); }
        .social-btn svg { width: 24px; height: 24px; }
        .social-btn.apple { background: #000 !important; border-color: #000 !important; }

        .login-redirect {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .login-redirect a {
            color: #0faebd;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .success-message {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(16,185,129,0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.show { display: flex; }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #0faebd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Şifre gücü göstergesi */
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
        }

        .strength-weak { background: #ff6b6b; width: 33%; }
        .strength-medium { background: #fbbf24; width: 66%; }
        .strength-strong { background: #10b981; width: 100%; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="success-message" id="successMessage">✅ Kayıt başarılı! Yönlendiriliyorsunuz...</div>

    <div class="register-container">
        <a href="dil-secimi.html" class="back-btn">←</a>

        <h1>Hesap Oluştur</h1>

        <div class="input-group">
            <input type="text" placeholder="Ad Soyad" id="fullName" required>
            <div class="error-message" id="nameError">Ad soyad giriniz</div>
        </div>

        <div class="input-group">
            <input type="email" placeholder="E-posta adresi" id="email" required>
            <div class="error-message" id="emailError">Geçerli bir e-posta giriniz</div>
        </div>

        <div class="input-group">
            <input type="password" placeholder="Şifre (en az 6 karakter)" id="password" required>
            <button type="button" class="password-toggle" id="togglePass1">👁</button>
            <div class="password-strength" id="strengthBar"></div>
            <div class="error-message" id="passwordError">Şifre en az 6 karakter olmalı</div>
        </div>

        <div class="input-group">
            <input type="password" placeholder="Şifre Tekrar" id="confirmPassword" required>
            <button type="button" class="password-toggle" id="togglePass2">👁</button>
            <div class="error-message" id="confirmError">Şifreler eşleşmiyor</div>
        </div>

        <button class="register-btn" id="registerBtn">Kayıt Ol</button>

        <div class="divider"><span>veya şununla devam et</span></div>

        <div class="social-login">
            <button class="social-btn" id="googleBtn" title="Google ile kayıt ol">
                <svg viewBox="0 0 24 24" fill="none">
                    <path fill="#EA4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#4285F4" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
            </button>

            <button class="social-btn" title="Facebook yakında">
                <svg viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>

            <button class="social-btn apple" title="Apple yakında">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
            </button>
        </div>

        <div class="login-redirect">
            Zaten hesabın var mı? <a href="giris.html">Giriş Yap</a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import {
            createUserWithEmailAndPassword,
            signInWithPopup,
            GoogleAuthProvider,
            updateProfile,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Zaten giriş yapıldıysa keşfete git
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'kesfet-genel.html';
            }
        });

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        function showFieldError(inputId, errorId, show) {
            document.getElementById(inputId).classList.toggle('error', show);
            document.getElementById(errorId).style.display = show ? 'block' : 'none';
        }

        // CityJoy ID oluştur
        function generateCityJoyId() {
            const year = new Date().getFullYear();
            const num = Math.floor(Math.random() * 900000) + 100000;
            return `CJ-${year}-${num}`;
        }

        // Şifre göster/gizle
        document.getElementById('togglePass1').addEventListener('click', () => {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('togglePass2').addEventListener('click', () => {
            const input = document.getElementById('confirmPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        // Şifre gücü göstergesi
        document.getElementById('password').addEventListener('input', (e) => {
            const val = e.target.value;
            const bar = document.getElementById('strengthBar');
            bar.className = 'password-strength';
            if (val.length === 0) return;
            if (val.length < 6) bar.classList.add('strength-weak');
            else if (val.length < 10) bar.classList.add('strength-medium');
            else bar.classList.add('strength-strong');
        });

        // Firebase'e kullanıcı kaydet
        async function saveUserToFirestore(uid, data) {
            await setDoc(doc(db, 'users', uid), {
                ...data,
                kayitTarihi: serverTimestamp(),
                sonGiris: serverTimestamp()
            });
        }

        // E-posta/Şifre ile Kayıt
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');

            let hasError = false;

            if (!fullName) { showFieldError('fullName', 'nameError', true); hasError = true; }
            else showFieldError('fullName', 'nameError', false);

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showFieldError('email', 'emailError', true); hasError = true;
            } else showFieldError('email', 'emailError', false);

            if (password.length < 6) { showFieldError('password', 'passwordError', true); hasError = true; }
            else showFieldError('password', 'passwordError', false);

            if (password !== confirmPassword) { showFieldError('confirmPassword', 'confirmError', true); hasError = true; }
            else showFieldError('confirmPassword', 'confirmError', false);

            if (hasError) return;

            btn.disabled = true;
            btn.textContent = 'Kaydediliyor...';
            showLoading(true);

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Profil güncelle
                await updateProfile(user, { displayName: fullName });

                // Firestore'a kaydet
                const cityJoyId = generateCityJoyId();
                await saveUserToFirestore(user.uid, {
                    uid: user.uid,
                    cityJoyId: cityJoyId,
                    ad: fullName.split(' ')[0],
                    soyad: fullName.split(' ').slice(1).join(' '),
                    email: email,
                    rol: 'kullanici',
                    dil: 'tr',
                    bildirimAktif: true,
                    profilResim: '',
                    sehirId: '',
                    mahalle: ''
                });

                showLoading(false);
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => { window.location.href = 'giris.html'; }, 1500);

            } catch (error) {
                showLoading(false);
                btn.disabled = false;
                btn.textContent = 'Kayıt Ol';

                if (error.code === 'auth/email-already-in-use') {
                    showFieldError('email', 'emailError', true);
                    document.getElementById('emailError').textContent = 'Bu e-posta zaten kayıtlı!';
                } else if (error.code === 'auth/weak-password') {
                    showFieldError('password', 'passwordError', true);
                    document.getElementById('passwordError').textContent = 'Şifre çok zayıf!';
                } else {
                    alert('Kayıt yapılamadı: ' + error.message);
                }
            }
        });

        // Google ile Kayıt
        document.getElementById('googleBtn').addEventListener('click', async () => {
            showLoading(true);
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Yeni kullanıcıysa Firestore'a ekle
                const cityJoyId = generateCityJoyId();
                await saveUserToFirestore(user.uid, {
                    uid: user.uid,
                    cityJoyId: cityJoyId,
                    ad: user.displayName?.split(' ')[0] || '',
                    soyad: user.displayName?.split(' ').slice(1).join(' ') || '',
                    email: user.email,
                    rol: 'kullanici',
                    dil: 'tr',
                    bildirimAktif: true,
                    profilResim: user.photoURL || '',
                    sehirId: '',
                    mahalle: ''
                });

                showLoading(false);
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => { window.location.href = 'anasayfa.html'; }, 1000);
            } catch (error) {
                showLoading(false);
                alert('Google ile kayıt yapılamadı.');
            }
        });

        // Enter tuşu
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('registerBtn').click();
        });
    </script>
</body>
</html>
