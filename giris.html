<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - CityJoy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1511497584788-876760111969?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 31, 28, 0.55);
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn:hover { background: rgba(255,255,255,0.2); }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .subtitle {
            color: rgba(255,255,255,0.6);
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-group input::placeholder { color: rgba(255,255,255,0.6) !important; }
        
        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover,
        .input-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px rgba(15,174,189,0.2) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .input-group input:focus {
            background: rgba(255,255,255,0.25);
            border-color: rgba(15,174,189,0.5);
            box-shadow: 0 0 0 3px rgba(15,174,189,0.1);
        }

        .input-group input.error {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.1);
        }

        .password-toggle {
            position: absolute;
            right: 15px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
            padding: 10px;
            background: rgba(255,107,107,0.1);
            border-radius: 8px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover { color: #0faebd; }

        .login-btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #0faebd 0%, #0d8a96 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(15,174,189,0.3);
        }

        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(15,174,189,0.4); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .divider span { color: rgba(255,255,255,0.6); font-size: 13px; padding: 0 15px; }

        .social-login {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .social-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
        }

        .social-btn:hover { transform: translateY(-3px); background: rgba(255,255,255,0.2); }
        .social-btn svg { width: 24px; height: 24px; display: block; }

        .social-btn.apple { background: #000 !important; border-color: #000 !important; }
        .social-btn.apple:hover { background: #333 !important; }

        .register-redirect {
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .register-redirect a {
            color: #0faebd;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .success-message {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15,174,189,0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.show { display: flex; }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #0faebd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="success-message" id="successMessage">✅ Giriş başarılı! Yönlendiriliyorsunuz...</div>

    <div class="login-container">
        <a href="dil-secimi.html" class="back-btn">←</a>

        <h1>Tekrar Hoşgeldin</h1>
        <p class="subtitle">CityJoy'a giriş yap</p>

        <div class="input-group">
            <input type="email" placeholder="E-posta adresi" id="email" required>
        </div>

        <div class="input-group">
            <input type="password" placeholder="Şifre" id="password" required>
            <button type="button" class="password-toggle" id="toggleBtn">👁</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="forgot-password">
            <a href="#" id="forgotLink">Şifremi unuttum?</a>
        </div>

        <button class="login-btn" id="loginBtn">Giriş Yap</button>

        <div class="divider"><span>veya şununla devam et</span></div>

        <div class="social-login">
            <!-- Google -->
            <button class="social-btn" id="googleBtn" title="Google ile giriş yap">
                <svg viewBox="0 0 24 24" fill="none">
                    <path fill="#EA4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#4285F4" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
            </button>

            <!-- Facebook -->
            <button class="social-btn" title="Facebook yakında">
                <svg viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>

            <!-- Apple -->
            <button class="social-btn apple" title="Apple yakında">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
            </button>
        </div>

        <div class="register-redirect">
            Hesabın yok mu? <a href="kayit.html">Kayıt Ol</a>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import {
            signInWithEmailAndPassword,
            signInWithPopup,
            GoogleAuthProvider,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Zaten giriş yapıldıysa keşfete git
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'kesfet-genel.html';
            }
        });

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('email').classList.add('error');
            document.getElementById('password').classList.add('error');
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('email').classList.remove('error');
            document.getElementById('password').classList.remove('error');
        }

        function showSuccess() {
            document.getElementById('successMessage').style.display = 'block';
        }

        // Şifre göster/gizle
        document.getElementById('toggleBtn').addEventListener('click', () => {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        // E-posta/Şifre ile Giriş
        document.getElementById('loginBtn').addEventListener('click', async () => {
            hideError();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showError('Lütfen e-posta ve şifrenizi girin!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Giriş yapılıyor...';
            showLoading(true);

            try {
                await signInWithEmailAndPassword(auth, email, password);
                localStorage.setItem('cj_oturum', 'acik');
                showSuccess();
                setTimeout(() => { window.location.href = 'anasayfa.html'; }, 800);
            } catch (error) {
                showLoading(false);
                btn.disabled = false;
                btn.textContent = 'Giriş Yap';
                const code = error.code;
                if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
                    showError('E-posta veya şifre hatalı!');
                } else if (code === 'auth/too-many-requests') {
                    showError('Çok fazla deneme! Lütfen biraz bekleyin.');
                } else if (code === 'auth/invalid-email') {
                    showError('Geçerli bir e-posta adresi girin!');
                } else {
                    showError('Giriş yapılamadı. Lütfen tekrar deneyin.');
                }
            }
        });

        // Google ile Giriş
        document.getElementById('googleBtn').addEventListener('click', async () => {
            showLoading(true);
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                showSuccess();
                setTimeout(() => { window.location.href = 'anasayfa.html'; }, 1000);
            } catch (error) {
                showLoading(false);
                showError('Google ile giriş yapılamadı. Tekrar deneyin.');
            }
        });

        // Şifremi Unuttum
        document.getElementById('forgotLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert('Lütfen önce e-posta adresinizi girin!');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert('✅ Şifre sıfırlama e-postası gönderildi! E-postanızı kontrol edin.');
            } catch (error) {
                alert('E-posta gönderilemedi. Adresi kontrol edin.');
            }
        });

        // Enter tuşu
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>
