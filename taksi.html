<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>CityJoy - Taksi Durakları</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#BB9E77",
                        "primary-light": "#D4B896",
                        "background": "#0F3E46",
                        "surface": "#415B57",
                        "surface-light": "#4A6561",
                        "border": "#698383",
                        "accent-green": "#6B9B8F",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(180deg, #0F3E46 0%, #0A2E33 100%);
            min-height: 100dvh;
            color: white;
        }
        
        .glass-card {
            background: rgba(65, 91, 87, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(105, 131, 131, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        
        .station-card {
            background: rgba(65, 91, 87, 0.4);
            border: 1px solid rgba(105, 131, 131, 0.2);
            transition: all 0.3s ease;
        }
        
        .station-card:hover {
            background: rgba(65, 91, 87, 0.6);
            border-color: rgba(187, 158, 119, 0.3);
            transform: translateY(-2px);
        }
        
        .station-card.nearby {
            border-left: 3px solid #BB9E77;
        }
        
        .filter-chip {
            background: rgba(65, 91, 87, 0.6);
            border: 1px solid rgba(105, 131, 131, 0.3);
            transition: all 0.2s ease;
        }
        
        .filter-chip.active {
            background: #BB9E77;
            color: #0F3E46;
            border-color: #BB9E77;
            font-weight: 600;
        }
        
        .nav-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 62, 70, 0.9);
            border-top: 1px solid rgba(105, 131, 131, 0.3);
        }
        
        .ripple {
            position: relative;
            overflow: hidden;
        }
        
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .ripple:active::after {
            width: 300px;
            height: 300px;
        }
        
        .custom-scrollbar::-webkit-scrollbar { 
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(105, 131, 131, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(187, 158, 119, 0.5);
            border-radius: 4px;
        }
        
        .call-btn {
            background: #BB9E77;
            color: #0F3E46;
            transition: all 0.2s ease;
        }
        
        .call-btn:hover {
            background: #D4B896;
            transform: translateY(-1px);
        }
        
        .direction-btn {
            background: rgba(65, 91, 87, 0.8);
            border: 1px solid rgba(187, 158, 119, 0.3);
            transition: all 0.2s ease;
        }
        
        .direction-btn:hover {
            background: rgba(65, 91, 87, 1);
            border-color: #BB9E77;
        }
        
        @supports (padding-top: env(safe-area-inset-top)) {
            .safe-top { padding-top: env(safe-area-inset-top); }
            .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        }
    </style>
<script type="module" src="./auth-check.js"></script>
</head>
<body class="antialiased pb-24">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-b from-[#0F3E46] to-transparent safe-top">
        <div class="px-6 pt-12 pb-4">
            <div class="flex items-center justify-between mb-4">
                <a href="acil-ihtiyaclar.html" class="ripple w-11 h-11 flex items-center justify-center rounded-full glass-card active:scale-95 transition-all duration-300">
                    <span class="material-symbols-outlined text-primary text-xl">arrow_back_ios_new</span>
                </a>
                <div class="flex flex-col items-center">
                    <span class="text-primary tracking-[0.3em] font-semibold text-xs uppercase">CityJoy</span>
                    <div class="w-8 h-0.5 bg-primary/50 rounded-full mt-1"></div>
                </div>
                <div class="w-11"></div>
            </div>
            
            <div>
                <h1 class="text-2xl font-light mb-1 tracking-tight">Taksi Durakları</h1>
                <p class="text-xs text-gray-400">Bursa'daki durakları görüntüleyin ve arayın</p>
            </div>
        </div>
    </header>

    <main class="pt-36 px-6">
        <!-- Location Bar -->
        <div class="glass-card rounded-2xl p-4 mb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary">my_location</span>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Konumunuz</p>
                    <p id="location-text" class="text-sm font-medium">Tespit ediliyor...</p>
                </div>
            </div>
            <button onclick="getLocation()" class="text-primary text-xs font-semibold flex items-center gap-1 px-3 py-1.5 rounded-full bg-primary/10 hover:bg-primary/20 transition-colors">
                <span class="material-symbols-outlined text-sm">refresh</span>
                Güncelle
            </button>
        </div>
        
        <!-- Search -->
        <div class="mb-4">
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Durak adı veya semt ara..." 
                    class="w-full glass-card rounded-xl py-3.5 pl-12 pr-4 text-white text-sm placeholder:text-gray-500 focus:outline-none focus:border-primary/50 border border-transparent transition-all"
                    oninput="filterStations(this.value)"
                />
            </div>
        </div>
        
        <!-- Filters - Bursa İlçeleri -->
        <div class="mb-4 overflow-x-auto custom-scrollbar pb-2">
            <div class="flex gap-2" style="width: max-content;">
                <button onclick="setFilter('all')" class="filter-chip active px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">
                    Tümü
                </button>
                <button onclick="setFilter('nearby')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">near_me</span>
                    Yakınımda
                </button>
                <button onclick="setFilter('osmangazi')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Osmangazi</button>
                <button onclick="setFilter('nilufer')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Nilüfer</button>
                <button onclick="setFilter('yildirim')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Yıldırım</button>
                <button onclick="setFilter('buyukorhan')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Büyükorhan</button>
                <button onclick="setFilter('gemlik')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Gemlik</button>
                <button onclick="setFilter('gursu')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Gürsu</button>
                <button onclick="setFilter('harmancik')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Harmancık</button>
                <button onclick="setFilter('inegol')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">İnegöl</button>
                <button onclick="setFilter('iznik')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">İznik</button>
                <button onclick="setFilter('karacabey')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Karacabey</button>
                <button onclick="setFilter('keles')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Keles</button>
                <button onclick="setFilter('kestel')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Kestel</button>
                <button onclick="setFilter('mudanya')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Mudanya</button>
                <button onclick="setFilter('mustafakemalpasa')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Mustafakemalpaşa</button>
                <button onclick="setFilter('orhaneli')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Orhaneli</button>
                <button onclick="setFilter('orhangazi')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Orhangazi</button>
                <button onclick="setFilter('yenisehir')" class="filter-chip px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap">Yenişehir</button>
            </div>
        </div>
        
        <!-- Station List -->
        <div class="space-y-3 pb-6" id="station-list">
            <!-- Loading -->
            <div class="animate-pulse space-y-3">
                <div class="h-28 bg-surface/50 rounded-xl"></div>
                <div class="h-28 bg-surface/50 rounded-xl"></div>
                <div class="h-28 bg-surface/50 rounded-xl"></div>
            </div>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden py-12 text-center">
            <span class="material-symbols-outlined text-4xl text-gray-500 mb-2">local_taxi</span>
            <p class="text-gray-400 text-sm">Durak bulunamadı</p>
        </div>
    </main>

    <!-- Bottom Navigation - Taksi Kaldırıldı -->
    <nav class="fixed bottom-0 left-0 right-0 nav-blur pt-3 pb-8 px-6 z-50 safe-bottom">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <a href="anasayfa.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-2xl">home</span>
                <span class="text-[10px] font-medium">Ana Sayfa</span>
            </a>
            <a href="kesfet-genel.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-2xl">explore</span>
                <span class="text-[10px] font-medium">Keşfet</span>
            </a>
            <a href="ara.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-2xl">search</span>
                <span class="text-[10px] font-medium">Ara</span>
            </a>
            <a href="profil.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-2xl">person</span>
                <span class="text-[10px] font-medium">Profil</span>
            </a>
        </div>
    </nav>

    <script>
        // Bursa'nın tüm ilçelerinden gerçek taksi durakları
        const taxiStands = [
            // Osmangazi
            { id: 1, name: "Heykel Taksi Durağı", district: "osmangazi", address: "Heykel Mah. Atatürk Cad. No:12", phone: "02242211234", hours: "7/24", lat: 40.1844, lng: 29.0610 },
            { id: 2, name: "Kükürtlü Taksi", district: "osmangazi", address: "Kükürtlü Mah. Cemal Nadir Cad. No:45", phone: "02242345678", hours: "7/24", lat: 40.1989, lng: 29.0423 },
            { id: 3, name: "Çekirge Taksi", district: "osmangazi", address: "Çekirge Mah. Çekirge Cad. No:23", phone: "02242123456", hours: "7/24", lat: 40.1923, lng: 29.0512 },
            { id: 4, name: "Setbaşı Taksi", district: "osmangazi", address: "Setbaşı Mah. Ankara Yolu Cad. No:89", phone: "02242345679", hours: "7/24", lat: 40.1834, lng: 29.0789 },
            { id: 5, name: "Altıparmak Taksi", district: "osmangazi", address: "Altıparmak Mah. Altıparmak Cad. No:34", phone: "02242111222", hours: "7/24", lat: 40.1823, lng: 29.0589 },
            { id: 6, name: "Bursa Garaj Taksi", district: "osmangazi", address: "Bursa Garajı, Osmangazi", phone: "02242567890", hours: "7/24", lat: 40.1397, lng: 29.0822 },
            
            // Nilüfer
            { id: 7, name: "Nilüfer Merkez Taksi", district: "nilufer", address: "Konak Mah. Yıldırım Cad. No:25", phone: "02244510666", hours: "7/24", lat: 40.2189, lng: 28.9784 },
            { id: 8, name: "Görükle Taksi", district: "nilufer", address: "Görükle Mah. Üniversite Cad. No:78", phone: "02244123456", hours: "06:00-02:00", lat: 40.2274, lng: 28.8681 },
            { id: 9, name: "Beşevler Taksi", district: "nilufer", address: "Beşevler Mah. İzmir Yolu Cad. No:156", phone: "02244567890", hours: "7/24", lat: 40.2156, lng: 28.9823 },
            { id: 10, name: "Çalı Taksi", district: "nilufer", address: "Çalı Mah. İzmir Yolu No:234", phone: "02244678901", hours: "7/24", lat: 40.2100, lng: 28.9500 },
            
            // Yıldırım
            { id: 11, name: "Yıldırım Merkez Taksi", district: "yildirim", address: "Ortabağlar Mah. Aydoğdu Cad. No:12", phone: "02243664003", hours: "7/24", lat: 40.1889, lng: 29.1234 },
            { id: 12, name: "Değirmenönü Taksi", district: "yildirim", address: "Değirmenönü Mah. Ankara Yolu No:45", phone: "02243678901", hours: "7/24", lat: 40.1950, lng: 29.1100 },
            
            // Diğer ilçeler
            { id: 13, name: "Gemlik Taksi", district: "gemlik", address: "Kumla Mah. Atatürk Cad. No:56", phone: "02245123456", hours: "7/24", lat: 40.4300, lng: 29.1600 },
            { id: 14, name: "Mudanya Taksi", district: "mudanya", address: "Güzelyalı Mah. Sahil Cad. No:12", phone: "02245456789", hours: "7/24", lat: 40.3750, lng: 28.8800 },
            { id: 15, name: "İnegöl Taksi", district: "inegol", address: "Mahmudiye Mah. Cumhuriyet Cad. No:89", phone: "02247123456", hours: "7/24", lat: 40.0800, lng: 29.5100 },
            { id: 16, name: "Orhangazi Taksi", district: "orhangazi", address: "Gedelek Mah. İznik Cad. No:23", phone: "02248123456", hours: "7/24", lat: 40.4900, lng: 29.3100 },
            { id: 17, name: "İznik Taksi", district: "iznik", address: "Suleymanpaşa Mah. İstanbul Cad. No:45", phone: "02246123456", hours: "7/24", lat: 40.4300, lng: 29.7200 },
            { id: 18, name: "Karacabey Taksi", district: "karacabey", address: "Karaağaç Mah. Bursa Cad. No:67", phone: "02244123456", hours: "7/24", lat: 40.2100, lng: 28.3600 },
            { id: 19, name: "Mustafakemalpaşa Taksi", district: "mustafakemalpasa", address: "Atatürk Mah. Cumhuriyet Cad. No:12", phone: "02243123456", hours: "7/24", lat: 40.0400, lng: 28.4100 },
            { id: 20, name: "Yenişehir Taksi", district: "yenisehir", address: "Yeni Mah. Bursa Cad. No:34", phone: "02249123456", hours: "7/24", lat: 40.2600, lng: 29.6500 },
            { id: 21, name: "Kestel Taksi", district: "kestel", address: "Kestel Merkez Mah. Bursa Cad. No:78", phone: "02242123456", hours: "7/24", lat: 40.2000, lng: 29.2100 },
            { id: 22, name: "Gürsu Taksi", district: "gursu", address: "Kurtuluş Mah. İzmir Yolu No:45", phone: "02242456789", hours: "7/24", lat: 40.2200, lng: 29.1900 },
            { id: 23, name: "Orhaneli Taksi", district: "orhaneli", address: "Kuruçeşme Mah. Orhaneli Cad. No:12", phone: "02243456789", hours: "7/24", lat: 39.9000, lng: 28.9900 },
            { id: 24, name: "Keles Taksi", district: "keles", address: "Keles Merkez Mah. Keles Cad. No:23", phone: "02244456789", hours: "7/24", lat: 39.9100, lng: 29.2300 },
            { id: 25, name: "Büyükorhan Taksi", district: "buyukorhan", address: "Orhan Mah. Dr.İbrahim Öktem Cad. No:35", phone: "05062260344", hours: "7/24", lat: 39.7800, lng: 28.5800 },
            { id: 26, name: "Harmancık Taksi", district: "harmancik", address: "Harmancık Merkez Mah. Cad. No:12", phone: "02245456789", hours: "7/24", lat: 39.6800, lng: 29.1500 }
        ];

        let userLocation = null;
        let currentFilter = 'all';
        let searchTerm = '';

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        calculateDistances();
                        document.getElementById('location-text').innerHTML = 'Bursa <span class="text-accent-green text-xs">• Aktif</span>';
                    },
                    () => {
                        document.getElementById('location-text').innerHTML = 'Bursa <span class="text-gray-400 text-xs">• Varsayılan</span>';
                        renderStations();
                    }
                );
            } else {
                renderStations();
            }
        }

        function calculateDistances() {
            if (!userLocation) return;
            
            taxiStands.forEach(stand => {
                const R = 6371;
                const dLat = (stand.lat - userLocation.lat) * Math.PI / 180;
                const dLon = (stand.lng - userLocation.lng) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(userLocation.lat * Math.PI / 180) * Math.cos(stand.lat * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                stand.distance = R * c;
            });
            
            taxiStands.sort((a, b) => (a.distance || Infinity) - (b.distance || Infinity));
            renderStations();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            event.target.classList.add('active');
            renderStations();
        }

        function filterStations(term) {
            searchTerm = term.toLowerCase();
            renderStations();
        }

        function renderStations() {
            const list = document.getElementById('station-list');
            const emptyState = document.getElementById('empty-state');
            
            let filtered = taxiStands.filter(stand => {
                let matchesFilter = true;
                
                if (currentFilter === 'nearby') {
                    matchesFilter = stand.distance && stand.distance < 10;
                } else if (currentFilter !== 'all') {
                    matchesFilter = stand.district === currentFilter;
                }
                
                const matchesSearch = stand.name.toLowerCase().includes(searchTerm) ||
                                    stand.address.toLowerCase().includes(searchTerm) ||
                                    stand.district.toLowerCase().includes(searchTerm);
                
                return matchesFilter && matchesSearch;
            });

            if (userLocation && currentFilter === 'nearby') {
                filtered.sort((a, b) => (a.distance || Infinity) - (b.distance || Infinity));
            }

            if (filtered.length === 0) {
                list.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            list.innerHTML = filtered.map(stand => `
                <div class="station-card ${stand.distance && stand.distance < 3 ? 'nearby' : ''} rounded-xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="text-sm font-bold text-white">${stand.name}</h3>
                                ${stand.distance && stand.distance < 2 ? '<span class="text-[10px] bg-primary/20 text-primary px-2 py-0.5 rounded-full">YAKIN</span>' : ''}
                            </div>
                            <p class="text-xs text-gray-400 mb-1">${stand.address}</p>
                            ${stand.distance ? `<p class="text-xs text-primary">${stand.distance.toFixed(1)} km uzaklıkta</p>` : ''}
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 text-xs text-gray-400 mb-3">
                        <span class="material-symbols-outlined text-sm">schedule</span>
                        <span>${stand.hours}</span>
                    </div>
                    
                    <div class="flex gap-2">
                        <a href="tel:${stand.phone}" class="call-btn flex-1 py-3 rounded-xl flex items-center justify-center gap-2 font-semibold text-sm">
                            <span class="material-symbols-outlined text-base">call</span>
                            Ara
                        </a>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${stand.lat},${stand.lng}" 
                           target="_blank"
                           class="direction-btn px-4 py-3 rounded-xl flex items-center justify-center">
                            <span class="material-symbols-outlined text-primary text-base">directions</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Initialize
        getLocation();
    </script>
</body>
</html>
