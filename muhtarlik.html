            const container = document.getElementById('districtContainer');

        }

        // Muhtar listesini render et
        function renderMuhtarlar() {
            const container = document.getElementById('muhtarList');
            const emptyState = document.getElementById('emptyState');
            
            let filtered = allMuhtarlar;
            
            // İlçe filtresi
            if (currentDistrict !== 'all') {
                filtered = filtered.filter(m => m.ilce === currentDistrict);
            }
            
            // Arama filtresi
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(m => 
                    m.mahalle.toLowerCase().includes(q) || 
                    m.muhtar.toLowerCase().includes(q)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            container.innerHTML = filtered.map((m, index) => `
                <div onclick="openDetail('${m.mahalle}', '${m.muhtar}', '${m.tel}', '${m.ilce}', ${m.nufus}, ${m.secmen}, '${m.bolge || ''}')" 
                    class="muhtar-card glass-card rounded-2xl p-4 flex items-center gap-4 cursor-pointer animate-slide-up"
                    style="animation-delay: ${index * 0.05}s">

            `).join('');

        // Arama
        function filterMuhtarlar() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            searchQuery = input.value;
            
            if (searchQuery) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }
            
            renderMuhtarlar();
        }

            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearBtn').style.display = 'none';
            renderMuhtarlar();

                </div>

                <!-- İletişim Bilgileri -->
                <div class="glass-card rounded-2xl p-5 space-y-4">
                    <h3 class="text-sm font-bold text-gold uppercase tracking-wider flex items-center gap-2">
                        <span class="material-symbols-outlined text-base">contact_phone</span>
                        İletişim Bilgileri
                    </h3>
                    
                    <div class="space-y-3">
                        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
                            <div class="flex items-center gap-3">
                                <span class="material-symbols-outlined text-gold">phone</span>
                                <div>
                                    <p class="text-xs text-gray-text">Telefon</p>
                                    <p class="text-sm font-medium text-off-white">${tel}</p>
                                </div>
                            </div>
                            <button onclick="copyToClipboard('${tel}')" class="text-gold hover:text-gold-light p-2 hover:bg-white/5 rounded-lg transition-colors">
                                <span class="material-symbols-outlined text-lg">content_copy</span>
                            </button>
                        </div>
                        
                        <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl">
                            <span class="material-symbols-outlined text-gold">location_on</span>
                            <div>
                                <p class="text-xs text-gray-text">Adres</p>
                                <p class="text-sm font-medium text-off-white">${mahalle} Mah. Muhtarlık Ofisi</p>
                                <p class="text-xs text-gray-text mt-0.5">${district.name}, Bursa</p>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl">
                            <span class="material-symbols-outlined text-gold">schedule</span>
                            <div>
                                <p class="text-xs text-gray-text">Çalışma Saatleri</p>
                                <p class="text-sm font-medium text-off-white">Hafta içi 09:00 - 17:00</p>
                                <p class="text-xs text-green-400 mt-0.5 flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                                    Şu anda açık
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mahalle İstatistikleri -->
                <div class="glass-card rounded-2xl p-5">
                    <h3 class="text-sm font-bold text-gold uppercase tracking-wider flex items-center gap-2 mb-4">
                        <span class="material-symbols-outlined text-base">analytics</span>
                        Mahalle İstatistikleri (2024)
                    </h3>
                    
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="bg-white/5 rounded-xl p-4 text-center">
                            <p class="text-2xl font-bold text-gold">${nufus.toLocaleString()}</p>
                            <p class="text-[10px] text-gray-text uppercase tracking-wider mt-1">Nüfus</p>
                        </div>
                        <div class="bg-white/5 rounded-xl p-4 text-center">
                            <p class="text-2xl font-bold text-gold">${secmen.toLocaleString()}</p>
                            <p class="text-[10px] text-gray-text uppercase tracking-wider mt-1">Seçmen</p>
                        </div>
                    </div>
                    
                    <div class="bg-white/5 rounded-xl p-3 flex items-center justify-between">
                        <span class="text-xs text-gray-text">Seçmen/Kayıtlı Nüfus Oranı</span>
                        <span class="text-sm font-bold text-gold">%${Math.round((secmen/nufus)*100)}</span>
                    </div>
                </div>

                <!-- Hızlı Talep -->
                <div class="glass-card rounded-2xl p-5 border-2 border-gold/30">
                    <h3 class="text-sm font-bold text-gold uppercase tracking-wider flex items-center gap-2 mb-3">
                        <span class="material-symbols-outlined text-base">quickreply</span>
                        Hızlı Talep
                    </h3>
                    <p class="text-xs text-gray-text mb-4">Bu muhtarlığa talep veya şikayet iletmek için:</p>
                    
                    <div class="space-y-2">
                        <button onclick="sendRequest('${mahalle}', 'sikayet')" class="w-full flex items-center gap-3 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-left">
                            <span class="material-symbols-outlined text-orange-400">report_problem</span>
                            <span class="text-sm">Şikayet Bildir</span>
                            <span class="material-symbols-outlined text-gray-text ml-auto">chevron_right</span>
                        </button>
                        
                        <button onclick="sendRequest('${mahalle}', 'talep')" class="w-full flex items-center gap-3 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-left">
                            <span class="material-symbols-outlined text-blue-400">lightbulb</span>
                            <span class="text-sm">Talepte Bulun</span>
                            <span class="material-symbols-outlined text-gray-text ml-auto">chevron_right</span>
                        </button>
                        
                        <button onclick="sendRequest('${mahalle}', 'randevu')" class="w-full flex items-center gap-3 p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-left">
                            <span class="material-symbols-outlined text-purple-400">event_available</span>
                            <span class="text-sm">Randevu Al</span>
                            <span class="material-symbols-outlined text-gray-text ml-auto">chevron_right</span>
                        </button>
                    </div>
                </div>

                <!-- Acil Durum -->
                <div class="bg-live-red/10 border border-live-red/30 rounded-2xl p-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-live-red/20 flex items-center justify-center shrink-0 pulse-live">
                        <span class="material-symbols-outlined text-live-red">emergency</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-live-red">Acil Durum</p>
                        <p class="text-xs text-gray-text">7/24 Acil Yardım: 112 / 153</p>
                    </div>
                    <a href="tel:153" class="w-10 h-10 rounded-full bg-live-red/20 flex items-center justify-center text-live-red hover:bg-live-red/30 transition-colors">
                        <span class="material-symbols-outlined">call</span>
                    </a>
                </div>

                <!-- Bilgi Notu -->
                <div class="glass-card rounded-xl p-4 bg-gradient-to-r from-gold/10 to-transparent border-l-4 border-gold">
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-gold text-xl shrink-0">info</span>
                        <div>
                            <p class="text-xs text-gray-text leading-relaxed">
                                Muhtarlık bilgileri Osmangazi Belediyesi kayıtlarından alınmaktadır. 
                                Bilgilerde değişiklik olması durumunda <strong class="text-gold">Alo 153</strong> hattından bildirim yapabilirsiniz.
                            </p>
                        </div>
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Harita aç
        function openMap(mahalle, ilce) {
            const query = encodeURIComponent(`${mahalle} Mahallesi, ${ilce}, Bursa`);
            window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
        }

        // Panoya kopyala
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Basit bir toast bildirimi
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gold text-deep-teal px-4 py-2 rounded-full text-sm font-medium z-[100] animate-fade-in';
                toast.textContent = 'Kopyalandı!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            });
        }

        // Talep gönder (Basit yönlendirme)
        function sendRequest(mahalle, type) {
            const typeNames = {
                'sikayet': 'Şikayet',
                'talep': 'Talep',
                'randevu': 'Randevu'
            };
            
            // Başkan'a Ulaşın sayfasına yönlendir veya modal aç
            alert(`${mahalle} Mahallesi için ${typeNames[type]} formu açılacak.\n\nNot: Bu özellik "Başkan'a Ulaşın" formuna entegre edilebilir.`);
        }

        // Başlangıç
        renderDistricts();
        renderMuhtarlar();
    </script>

</body>
</html>
